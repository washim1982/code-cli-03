[pytest]
testpaths = test

# src layout: the package lives under src/, which is not on sys.path by default.
# Without this, `from omni import runtime` resolves only when pytest happens to
# be invoked as `python -m pytest` from the repo root — the current directory
# lands on sys.path by accident and the tests appear to pass. Running from
# anywhere else, or via the bare `pytest` console script, fails collection.
#
# Once the package is installed (`pip install -e .`) this line is redundant but
# harmless, and it keeps the suite runnable straight from a clone.
pythonpath = src

markers =
    slow: end-to-end tests that spawn real subprocesses
